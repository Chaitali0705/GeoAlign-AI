[project]
name = "geoalign-ai"
version = "1.0.0"
description = "ML-assisted cadastral parcel alignment for satellite imagery"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.0",
    "numpy>=1.24",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "scikit-image>=0.24",
    "scipy>=1.10",
    "scikit-learn>=1.4",
    "shapely>=2.0",
]

[project.scripts]
geoalign-ai = "fieldalign.pipeline:main"
